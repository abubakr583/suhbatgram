name: Build SuhbatGram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Disk joyini bo'shatish
        run: sudo rm -rf /usr/share/dotnet /opt/ghc || true

      - name: Kodni yuklab olish
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: SDK uchun Java 17 sozlash
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK 33, Build-Tools 33.0.1, NDK 21 va CMake o'rnatish
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDK_MANAGER --licenses > /dev/null 2>&1 || true
          $SDK_MANAGER "build-tools;30.0.3" "build-tools;33.0.1" "platforms;android-33" "platform-tools" "ndk;21.4.7075529" "cmake;3.10.2.4988404"
          cp "$ANDROID_HOME/build-tools/30.0.3/dx" "$ANDROID_HOME/build-tools/33.0.1/dx" || true
          mkdir -p "$ANDROID_HOME/build-tools/33.0.1/lib"
          cp "$ANDROID_HOME/build-tools/30.0.3/lib/dx.jar" "$ANDROID_HOME/build-tools/33.0.1/lib/dx.jar" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Gradle uchun Java 11 sozlash
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Keystore, API kalitlar, logo va SuhbatGram funksiyalarini qo'shish
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          python3 -c "import PIL" 2>/dev/null || pip3 install --break-system-packages pillow || (sudo apt-get update && sudo apt-get install -y python3-pil)

          mkdir -p TMessagesProj/config
          rm -f TMessagesProj/config/extera.jks
          keytool -genkeypair -v -keystore TMessagesProj/config/extera.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias suhbatgram \
            -storepass suhbatgram123 -keypass suhbatgram123 \
            -dname "CN=SuhbatGram, OU=Dev, O=SuhbatGram, L=Tashkent, S=Tashkent, C=UZ"

          python3 - << 'EOF'
          import os, re
          from PIL import Image

          app_id = "".join(os.environ.get("APP_ID", "").split())
          app_hash = "".join(os.environ.get("APP_HASH", "").split()).strip('"').strip("'")

          if not app_id.isdigit():
              raise SystemExit("ERROR: APP_ID faqat raqamlardan iborat bo'lishi kerak!")
          if not app_hash:
              raise SystemExit("ERROR: APP_HASH bo'sh!")

          with open("API_KEYS", "w", encoding="utf-8") as f:
              f.write(
                  f'APP_ID={app_id}\n'
                  f'APP_HASH="{app_hash}"\n'
                  f'MAPS_V2_API=none\n'
                  f'SIGNING_KEY_STORE_PASSWORD=suhbatgram123\n'
                  f'SIGNING_KEY_ALIAS=suhbatgram\n'
                  f'SIGNING_KEY_PASSWORD=suhbatgram123\n'
              )

          bv_path = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if os.path.exists(bv_path):
              with open(bv_path, "r", encoding="utf-8") as f:
                  c = f.read()
              c = re.sub(r"public static int APP_ID = .*?;", f"public static int APP_ID = {app_id};", c)
              c = re.sub(r"public static String APP_HASH = .*?;", f'public static String APP_HASH = "{app_hash}";', c)
              with open(bv_path, "w", encoding="utf-8") as f:
                  f.write(c)

          # 1. Boost stub klasslari
          names_decl = "public static CharSequence[] names = new CharSequence[0];"
          for root, _, files in os.walk("TMessagesProj/src/main/java"):
              if "PopupUtils.java" in files:
                  with open(os.path.join(root, "PopupUtils.java"), "r", encoding="utf-8") as f:
                      pu = f.read()
                  for params in re.findall(r"showDialog\s*\(([^)]+)\)", pu, re.S):
                      parts = [p.strip() for p in params.split(",")]
                      if len(parts) == 5 and "Context" in parts[3]:
                          t = parts[0]
                          if "ArrayList<CharSequence>" in t:
                              names_decl = "public static java.util.ArrayList<CharSequence> names = new java.util.ArrayList<>();"
                          elif "ArrayList" in t:
                              names_decl = "public static java.util.ArrayList<String> names = new java.util.ArrayList<>();"
                          elif "List<CharSequence>" in t:
                              names_decl = "public static java.util.List<CharSequence> names = new java.util.ArrayList<>();"
                          elif "List" in t:
                              names_decl = "public static java.util.List<String> names = new java.util.ArrayList<>();"
                          elif "String[]" in t:
                              names_decl = "public static String[] names = new String[0];"
                          else:
                              names_decl = "public static CharSequence[] names = new CharSequence[0];"
                          break
                  break

          base = "TMessagesProj/src/main/java/com/exteragram/messenger/boost"
          os.makedirs(f"{base}/filter", exist_ok=True)
          os.makedirs(f"{base}/encryption", exist_ok=True)

          with open(f"{base}/BoostController.java", "w", encoding="utf-8") as f:
              f.write("package com.exteragram.messenger.boost;\npublic class BoostController {\n    public static boolean isUserBooster() { return false; }\n}\n")

          with open(f"{base}/filter/ZalgoFilter.java", "w", encoding="utf-8") as f:
              f.write("package com.exteragram.messenger.boost.filter;\npublic class ZalgoFilter {\n    public static CharSequence filterMessage(CharSequence cs) { return cs; }\n    public static String filterMessage(String s) { return s; }\n}\n")

          with open(f"{base}/encryption/BaseEncryptor.java", "w", encoding="utf-8") as f:
              f.write("package com.exteragram.messenger.boost.encryption;\npublic class BaseEncryptor {\n    public String getName() { return \"\"; }\n}\n")

          with open(f"{base}/encryption/EncryptionHelper.java", "w", encoding="utf-8") as f:
              f.write(
                  "package com.exteragram.messenger.boost.encryption;\n"
                  "import org.telegram.messenger.MessageObject;\n"
                  "public class EncryptionHelper {\n"
                  f"    {names_decl}\n"
                  "    public interface Callback { void run(String message); }\n"
                  "    public static BaseEncryptor getEncryptorBy(long dialogId) { return new BaseEncryptor(); }\n"
                  "    public static int getEncryptorTypeFor(long dialogId) { return 0; }\n"
                  "    public static void setEncryptorTypeFor(long dialogId, int type) {}\n"
                  "    public static void encryptMessage(String text, long dialogId, int type, Callback cb) { if (cb != null) cb.run(text); }\n"
                  "    public static String encryptMessage(String text, long dialogId, BaseEncryptor enc) { return text; }\n"
                  "    public static boolean isEncrypted(CharSequence text) { return false; }\n"
                  "    public static boolean isEncrypted(MessageObject m, Object g) { return false; }\n"
                  "    public static MessageObject decryptMessage(MessageObject m) { return m; }\n"
                  "    public static MessageObject decryptMessage(MessageObject m, Object g) { return m; }\n"
                  "}\n"
              )

          # 2. Ilova nomini SuhbatGram qilish
          res_dir = "TMessagesProj/src/main/res"
          for root, _, files in os.walk(res_dir):
              if "strings.xml" in files:
                  sp = os.path.join(root, "strings.xml")
                  with open(sp, "r", encoding="utf-8", errors="ignore") as f:
                      txt = f.read()
                  new_txt = re.sub(
                      r"(<string\b[^>]*>)(.*?)(</string>)",
                      lambda m: m.group(1) + re.sub(r"exteragram", "SuhbatGram", m.group(2), flags=re.I) + m.group(3),
                      txt,
                      flags=re.S,
                  )
                  if new_txt != txt:
                      with open(sp, "w", encoding="utf-8") as f:
                          f.write(new_txt)

          bg_path = "TMessagesProj/build.gradle"
          if os.path.exists(bg_path):
              with open(bg_path, "r", encoding="utf-8") as f:
                  bg = f.read()
              bg2 = re.sub(r'("AppName"\s*,\s*")([^"]+)(")', r'\1SuhbatGram\3', bg)
              bg2 = re.sub(r'(appName\s*:\s*")([^"]+)(")', r'\1SuhbatGram\3', bg2)
              if bg2 != bg:
                  with open(bg_path, "w", encoding="utf-8") as f:
                      f.write(bg2)

          # 3. Logotipni o'rnatish (logo.png / logo.jpg / logo.jpeg / logo.webp)
          logo_file = None
          for fname in os.listdir("."):
              low = fname.lower()
              if low.startswith("logo.") and low.endswith((".png", ".jpg", ".jpeg", ".webp")):
                  logo_file = fname
                  break

          if logo_file:
              print("Logo topildi:", logo_file)
              im = Image.open(logo_file).convert("RGBA")
              w, h = im.size
              side = min(w, h)
              im = im.crop(((w - side) // 2, (h - side) // 2, (w + side) // 2, (h + side) // 2))

              densities = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }

              anydpi = os.path.join(res_dir, "mipmap-anydpi-v26")
              if os.path.isdir(anydpi):
                  for xf in list(os.listdir(anydpi)):
                      if xf.endswith(".xml") and "launcher" in xf.lower():
                          stem = xf[:-4]
                          for dname, sz in densities.items():
                              ddir = os.path.join(res_dir, dname)
                              os.makedirs(ddir, exist_ok=True)
                              im.resize((sz, sz), Image.LANCZOS).save(os.path.join(ddir, stem + ".png"), "PNG")
                          os.remove(os.path.join(anydpi, xf))

              for root, _, files in os.walk(res_dir):
                  if "mipmap" in os.path.basename(root):
                      for fn in files:
                          if fn.endswith(".png") and ("launcher" in fn.lower() or "foreground" in fn.lower()):
                              p = os.path.join(root, fn)
                              try:
                                  ow, oh = Image.open(p).size
                                  im.resize((ow, oh), Image.LANCZOS).save(p, "PNG")
                              except Exception:
                                  pass

          # 4. SendMessagesHelper signaturasini aniqlash
          smh_path = "TMessagesProj/src/main/java/org/telegram/messenger/SendMessagesHelper.java"
          send_call = ""
          if os.path.exists(smh_path):
              with open(smh_path, "r", encoding="utf-8", errors="ignore") as f:
                  smh = f.read()

              def build_args(param_str):
                  s = param_str
                  while "<" in s:
                      s = re.sub(r"<[^<>]*>", "", s)
                  parts = [p.strip() for p in s.split(",") if p.strip()]
                  if len(parts) < 2:
                      return None
                  if not parts[0].startswith("String ") or not parts[1].startswith("long "):
                      return None
                  args = ["replyText", "dialogId"]
                  for p in parts[2:]:
                      t = p.split()[0]
                      if t == "boolean":
                          args.append("true" if "notify" in p.lower() else "false")
                      elif t in ("int", "long", "float", "double", "short", "byte"):
                          args.append("0")
                      else:
                          args.append("null")
                  return ", ".join(args)

              for m in re.finditer(r"public\s+static\s+SendMessageParams\s+of\s*\(([^)]+)\)", smh, re.S):
                  a = build_args(m.group(1))
                  if a:
                      send_call = f"SendMessagesHelper.getInstance(currentAccount).sendMessage(SendMessagesHelper.SendMessageParams.of({a}));"
                      break

              if not send_call:
                  for m in re.finditer(r"public\s+void\s+sendMessage\s*\(([^)]+)\)", smh, re.S):
                      a = build_args(m.group(1))
                      if a:
                          send_call = f"SendMessagesHelper.getInstance(currentAccount).sendMessage({a});"
                          break

          print("Aniqlangan send_call:", send_call)

          # 5. SuhbatConfig.java (Sozlamalar oynasi + Lokal Premium + Anti-Delete + Direct Avto-Javob)
          suhbat_java = r'''package com.exteragram.messenger;

          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.telegram.messenger.AndroidUtilities;
          import org.telegram.messenger.ApplicationLoader;
          import org.telegram.messenger.MessagesController;
          import org.telegram.messenger.SendMessagesHelper;
          import org.telegram.messenger.UserConfig;
          import org.telegram.tgnet.ConnectionsManager;
          import org.telegram.tgnet.TLRPC;

          import java.util.ArrayList;
          import java.util.HashSet;

          public class SuhbatConfig {
              private static final String PREFS = "suhbatgram_prefs";
              private static final String KEY_PREMIUM = "local_premium";
              private static final String KEY_ANTIDELETE = "anti_delete";
              private static final String KEY_AUTOREPLY = "auto_reply_enabled";
              private static final String KEY_RULES = "auto_reply_rules_v1";
              private static final String SEP_PAIR = "\u001F";
              private static final String SEP_ROW = "\u001E";
              private static final HashSet<Integer> repliedIds = new HashSet<>();

              private static SharedPreferences prefs() {
                  return ApplicationLoader.applicationContext.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              public static boolean isLocalPremium() {
                  try {
                      return prefs().getBoolean(KEY_PREMIUM, true);
                  } catch (Throwable ignored) {
                      return false;
                  }
              }

              public static void setLocalPremium(boolean enabled) {
                  prefs().edit().putBoolean(KEY_PREMIUM, enabled).apply();
              }

              public static boolean isAntiDelete() {
                  try {
                      return prefs().getBoolean(KEY_ANTIDELETE, true);
                  } catch (Throwable ignored) {
                      return false;
                  }
              }

              public static void setAntiDelete(boolean enabled) {
                  prefs().edit().putBoolean(KEY_ANTIDELETE, enabled).apply();
              }

              public static boolean isAutoReplyEnabled() {
                  try {
                      return prefs().getBoolean(KEY_AUTOREPLY, false);
                  } catch (Throwable ignored) {
                      return false;
                  }
              }

              public static void setAutoReplyEnabled(boolean enabled) {
                  prefs().edit().putBoolean(KEY_AUTOREPLY, enabled).apply();
              }

              public static ArrayList<String[]> getRules() {
                  ArrayList<String[]> list = new ArrayList<>();
                  try {
                      String raw = prefs().getString(KEY_RULES, null);
                      if (raw == null) {
                          list.add(new String[]{"salom", "Assalomu alaykum! Hozir bandman, birozdan keyin javob yozaman."});
                          saveRules(list);
                          return list;
                      }
                      if (raw.isEmpty()) {
                          return list;
                      }
                      String[] rows = raw.split(SEP_ROW);
                      for (String r : rows) {
                          String[] kv = r.split(SEP_PAIR, 2);
                          if (kv.length == 2 && !kv[0].trim().isEmpty() && !kv[1].trim().isEmpty()) {
                              list.add(new String[]{kv[0], kv[1]});
                          }
                      }
                  } catch (Throwable ignored) {}
                  return list;
              }

              public static void saveRules(ArrayList<String[]> list) {
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < list.size(); i++) {
                      if (i > 0) sb.append(SEP_ROW);
                      String k = list.get(i)[0].replace(SEP_PAIR, " ").replace(SEP_ROW, " ").trim();
                      String v = list.get(i)[1].replace(SEP_PAIR, " ").replace(SEP_ROW, " ").trim();
                      sb.append(k).append(SEP_PAIR).append(v);
                  }
                  prefs().edit().putString(KEY_RULES, sb.toString()).apply();
              }

              public static void handleIncomingMessage(final int currentAccount, final TLRPC.Message message) {
                  try {
                      if (!isAutoReplyEnabled() || message == null || message.out || message.post) {
                          return;
                      }
                      if (TextUtils.isEmpty(message.message)) {
                          return;
                      }
                      if (!(message.peer_id instanceof TLRPC.TL_peerUser)) {
                          return;
                      }
                      final long dialogId = message.peer_id.user_id;
                      if (dialogId == 0 || dialogId == UserConfig.getInstance(currentAccount).getClientUserId()) {
                          return;
                      }
                      TLRPC.User sender = MessagesController.getInstance(currentAccount).getUser(dialogId);
                      if (sender != null && sender.bot) {
                          return;
                      }
                      int now = ConnectionsManager.getInstance(currentAccount).getCurrentTime();
                      if (Math.abs(now - message.date) > 60) {
                          return;
                      }
                      synchronized (repliedIds) {
                          if (repliedIds.contains(message.id)) {
                              return;
                          }
                          if (repliedIds.size() > 500) {
                              repliedIds.clear();
                          }
                          repliedIds.add(message.id);
                      }

                      String incoming = message.message.trim().toLowerCase();
                      ArrayList<String[]> rules = getRules();
                      String matched = null;
                      for (String[] pair : rules) {
                          String key = pair[0].trim().toLowerCase();
                          if (!key.isEmpty() && incoming.contains(key)) {
                              matched = pair[1];
                              break;
                          }
                      }
                      if (matched == null) {
                          return;
                      }
                      final String replyText = matched;
                      AndroidUtilities.runOnUIThread(() -> {
                          try {
                              __SEND_CALL__
                          } catch (Throwable ignored) {}
                      });
                  } catch (Throwable ignored) {}
              }

              private static int dp(Context c, int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, c.getResources().getDisplayMetrics());
              }

              public static void showSettingsDialog(final Context context) {
                  if (context == null) return;
                  ScrollView scroll = new ScrollView(context);
                  LinearLayout root = new LinearLayout(context);
                  root.setOrientation(LinearLayout.VERTICAL);
                  int pad = dp(context, 18);
                  root.setPadding(pad, dp(context, 12), pad, dp(context, 12));
                  scroll.addView(root);

                  Switch swPremium = new Switch(context);
                  swPremium.setText("Lokal Telegram Premium");
                  swPremium.setChecked(isLocalPremium());
                  swPremium.setPadding(0, dp(context, 8), 0, dp(context, 8));
                  swPremium.setOnCheckedChangeListener((b, checked) -> {
                      setLocalPremium(checked);
                      Toast.makeText(context, checked ? "Lokal Premium yoqildi" : "Lokal Premium o'chirildi", Toast.LENGTH_SHORT).show();
                  });
                  root.addView(swPremium);

                  Switch swAnti = new Switch(context);
                  swAnti.setText("Anti-Delete (O'chirilgan xabar/chat)");
                  swAnti.setChecked(isAntiDelete());
                  swAnti.setPadding(0, dp(context, 8), 0, dp(context, 8));
                  swAnti.setOnCheckedChangeListener((b, checked) -> {
                      setAntiDelete(checked);
                      Toast.makeText(context, checked ? "Anti-Delete yoqildi" : "Anti-Delete o'chirildi", Toast.LENGTH_SHORT).show();
                  });
                  root.addView(swAnti);

                  Switch swAuto = new Switch(context);
                  swAuto.setText("Direct Avto-Javob");
                  swAuto.setChecked(isAutoReplyEnabled());
                  swAuto.setPadding(0, dp(context, 8), 0, dp(context, 8));
                  swAuto.setOnCheckedChangeListener((b, checked) -> {
                      setAutoReplyEnabled(checked);
                      Toast.makeText(context, checked ? "Avto-javob yoqildi" : "Avto-javob o'chirildi", Toast.LENGTH_SHORT).show();
                  });
                  root.addView(swAuto);

                  TextView header = new TextView(context);
                  header.setText("Avto-javob kalit so'zlari:");
                  header.setTypeface(null, Typeface.BOLD);
                  header.setTextSize(15);
                  header.setPadding(0, dp(context, 14), 0, dp(context, 6));
                  root.addView(header);

                  final LinearLayout rulesBox = new LinearLayout(context);
                  rulesBox.setOrientation(LinearLayout.VERTICAL);
                  root.addView(rulesBox);

                  final Runnable[] refreshRef = new Runnable[1];
                  refreshRef[0] = () -> {
                      rulesBox.removeAllViews();
                      ArrayList<String[]> rules = getRules();
                      if (rules.isEmpty()) {
                          TextView empty = new TextView(context);
                          empty.setText("Hali kalit so'z qo'shilmagan.");
                          empty.setPadding(0, dp(context, 4), 0, dp(context, 8));
                          rulesBox.addView(empty);
                          return;
                      }
                      for (int i = 0; i < rules.size(); i++) {
                          final int idx = i;
                          String[] pair = rules.get(i);
                          LinearLayout row = new LinearLayout(context);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setGravity(Gravity.CENTER_VERTICAL);
                          row.setBackgroundColor(Color.argb(28, 128, 128, 128));
                          int rp = dp(context, 10);
                          row.setPadding(rp, rp, rp, rp);
                          LinearLayout.LayoutParams rlp = new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          );
                          rlp.bottomMargin = dp(context, 8);
                          row.setLayoutParams(rlp);

                          TextView tv = new TextView(context);
                          tv.setText("So'z: " + pair[0] + "\nJavob: " + pair[1]);
                          tv.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                          row.addView(tv);

                          Button del = new Button(context);
                          del.setText("O'chirish");
                          del.setTextSize(12);
                          del.setOnClickListener(v -> {
                              ArrayList<String[]> cur = getRules();
                              if (idx < cur.size()) {
                                  cur.remove(idx);
                                  saveRules(cur);
                                  refreshRef[0].run();
                              }
                          });
                          row.addView(del);
                          rulesBox.addView(row);
                      }
                  };
                  refreshRef[0].run();

                  Button addBtn = new Button(context);
                  addBtn.setText("+ Kalit so'z qo'shish");
                  addBtn.setOnClickListener(v -> {
                      LinearLayout box = new LinearLayout(context);
                      box.setOrientation(LinearLayout.VERTICAL);
                      box.setPadding(dp(context, 18), dp(context, 10), dp(context, 18), dp(context, 6));

                      EditText keyInput = new EditText(context);
                      keyInput.setHint("Kalit so'z (masalan: salom)");
                      box.addView(keyInput);

                      EditText valInput = new EditText(context);
                      valInput.setHint("Avto-javob matni");
                      box.addView(valInput);

                      new AlertDialog.Builder(context)
                              .setTitle("Yangi kalit so'z")
                              .setView(box)
                              .setPositiveButton("Qo'shish", (d, w) -> {
                                  String k = keyInput.getText().toString().trim();
                                  String val = valInput.getText().toString().trim();
                                  if (k.isEmpty() || val.isEmpty()) {
                                      Toast.makeText(context, "Ikkala maydonni ham to'ldiring!", Toast.LENGTH_SHORT).show();
                                      return;
                                  }
                                  ArrayList<String[]> cur = getRules();
                                  cur.add(new String[]{k, val});
                                  saveRules(cur);
                                  refreshRef[0].run();
                              })
                              .setNegativeButton("Bekor", null)
                              .show();
                  });
                  root.addView(addBtn);

                  new AlertDialog.Builder(context)
                          .setTitle("SuhbatGram Sozlamalari")
                          .setView(scroll)
                          .setPositiveButton("Tayyor", null)
                          .show();
              }
          }
          '''.replace("__SEND_CALL__", send_call if send_call else "// no send call")

          # Heredoc boshidagi 10 ta bo'shliqni olib tashlash
          suhbat_lines = [line[10:] if line.startswith("          ") else line for line in suhbat_java.splitlines()]
          with open("TMessagesProj/src/main/java/com/exteragram/messenger/SuhbatConfig.java", "w", encoding="utf-8") as f:
              f.write("\n".join(suhbat_lines) + "\n")

          # 6. Lokal Premium ulash (UserConfig.java)
          uc_path = "TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java"
          if os.path.exists(uc_path):
              with open(uc_path, "r", encoding="utf-8") as f:
                  uc = f.read()
              uc2 = re.sub(
                  r"(public\s+boolean\s+isPremium\s*\(\s*\)\s*\{)",
                  r"\1 if (currentUser != null && com.exteragram.messenger.SuhbatConfig.isLocalPremium()) return true;",
                  uc,
                  count=1,
              )
              if uc2 != uc:
                  with open(uc_path, "w", encoding="utf-8") as f:
                      f.write(uc2)
                  print("PATCHED: UserConfig.isPremium")

          # 7. Anti-Delete va Direct Avto-Javob ulash (MessagesController.java)
          def find_block_end(code, open_brace_idx):
              depth = 0
              i = open_brace_idx
              n = len(code)
              in_str = None
              while i < n:
                  ch = code[i]
                  if in_str:
                      if ch == "\\" and i + 1 < n:
                          i += 2
                          continue
                      if ch == in_str:
                          in_str = None
                  else:
                      if ch in ('"', "'"):
                          in_str = ch
                      elif ch == "/" and i + 1 < n and code[i + 1] == "/":
                          nl = code.find("\n", i)
                          i = n if nl == -1 else nl
                      elif ch == "/" and i + 1 < n and code[i + 1] == "*":
                          endc = code.find("*/", i + 2)
                          i = n if endc == -1 else endc + 1
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              return -1

          mc_path = "TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java"
          if os.path.exists(mc_path):
              with open(mc_path, "r", encoding="utf-8", errors="ignore") as f:
                  mc = f.read()

              # Anti-Delete: TL_updateDeleteMessages va TL_updateDeleteChannelMessages bloklarini himoyalash
              for cls in ("TL_updateDeleteMessages", "TL_updateDeleteChannelMessages"):
                  pat = re.compile(r"\binstanceof\s+TLRPC\." + cls + r"\s*\)\s*\{")
                  pos = 0
                  count = 0
                  while True:
                      m = pat.search(mc, pos)
                      if not m:
                          break
                      ob = m.end() - 1
                      cb = find_block_end(mc, ob)
                      if cb == -1:
                          break
                      inner = mc[ob + 1 : cb]
                      if "SuhbatConfig.isAntiDelete" not in inner:
                          wrapped = "\n if (!com.exteragram.messenger.SuhbatConfig.isAntiDelete()) { " + inner + " }\n"
                          mc = mc[: ob + 1] + wrapped + mc[cb:]
                          pos = ob + 1 + len(wrapped) + 1
                          count += 1
                      else:
                          pos = cb + 1
                  print(f"PATCHED Anti-Delete ({cls}): {count}")

              # Direct Avto-Javob: processUpdateArray ichidagi TL_updateNewMessage
              pua = mc.find("processUpdateArray(")
              if pua != -1:
                  m = re.search(r"(\w+)\s+instanceof\s+TLRPC\.TL_updateNewMessage\s*\)\s*\{", mc[pua:])
                  if m:
                      var_name = m.group(1)
                      ins_pos = pua + m.end()
                      hook = f" com.exteragram.messenger.SuhbatConfig.handleIncomingMessage(currentAccount, ((TLRPC.TL_updateNewMessage) {var_name}).message); "
                      mc = mc[:ins_pos] + hook + mc[ins_pos:]
                      print("PATCHED Direct Auto-Reply in processUpdateArray")

              with open(mc_path, "w", encoding="utf-8") as f:
                  f.write(mc)

          # 8. SuhbatGram Sozlamalari tugmasini Yon menyu (Drawer) va Sozlamalar (ProfileActivity) ga qo'shish
          dla_path = "TMessagesProj/src/main/java/org/telegram/ui/Adapters/DrawerLayoutAdapter.java"
          la_path = "TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java"
          if os.path.exists(dla_path) and os.path.exists(la_path):
              with open(dla_path, "r", encoding="utf-8") as f:
                  dla = f.read()
              m = re.search(r"(items\.add\(\s*new\s+Item\(\s*8\s*,[^\n;]+;\s*)", dla)
              if m:
                  orig = m.group(1)
                  clone = re.sub(r"Item\(\s*8\s*,", "Item(999,", orig, count=1)
                  clone = re.sub(r"LocaleController\.getString\([^)]*\)", '"SuhbatGram Sozlamalari"', clone, count=1)
                  dla = dla[: m.end()] + clone + dla[m.end() :]
                  with open(dla_path, "w", encoding="utf-8") as f:
                      f.write(dla)
                  print("PATCHED DrawerLayoutAdapter")

              with open(la_path, "r", encoding="utf-8") as f:
                  la = f.read()
              la2 = re.sub(
                  r"(int\s+id\s*=\s*drawerLayoutAdapter\.getId\(position\);)",
                  r'\1 if (id == 999) { com.exteragram.messenger.SuhbatConfig.showSettingsDialog(LaunchActivity.this); drawerLayoutContainer.closeDrawer(false); return; }',
                  la,
                  count=1,
              )
              if la2 != la:
                  with open(la_path, "w", encoding="utf-8") as f:
                      f.write(la2)
                  print("PATCHED LaunchActivity")

          pa_path = "TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java"
          if os.path.exists(pa_path):
              with open(pa_path, "r", encoding="utf-8") as f:
                  pa = f.read()
              pa2 = re.sub(
                  r"(otherItem\.addSubItem\([^;]+R\.string\.LogOut[^;]*\);)",
                  r'otherItem.addSubItem(9999, 0, "SuhbatGram Sozlamalari"); \1',
                  pa,
                  count=1,
              )
              pa2 = re.sub(
                  r"(actionBar\.setActionBarMenuOnItemClick\s*\(\s*new\s+ActionBar\.ActionBarMenuOnItemClick\s*\(\s*\)\s*\{\s*@Override\s*public\s+void\s+onItemClick\s*\(\s*int\s+id\s*\)\s*\{)",
                  r"\1 if (id == 9999) { com.exteragram.messenger.SuhbatConfig.showSettingsDialog(getParentActivity()); return; }",
                  pa2,
                  count=1,
              )
              if pa2 != pa:
                  with open(pa_path, "w", encoding="utf-8") as f:
                      f.write(pa2)
                  print("PATCHED ProfileActivity")
          EOF

      - name: Gradle ruxsatini berish
        run: chmod +x gradlew

      - name: APK yig'ish (arm64-v8a)
        env:
          GRADLE_OPTS: "-Xmx5g -Xss16m"
        run: ./gradlew assembleArm64Release --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx5g -Xss16m"

      - name: Tayyor APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: SuhbatGram-APK
          path: "**/build/outputs/apk/**/*.apk"
